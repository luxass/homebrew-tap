name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test-bot:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew and check out the tap
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          token: ${{ github.token }}
          stable: true

      - name: Clean runner state
        run: brew test-bot --only-cleanup-before

      - name: Check Homebrew setup
        run: brew test-bot --only-setup

      - name: Validate formula and cask definitions
        # Stable checks allow the release updater’s inline checksum markers.
        run: brew test-bot --only-tap-syntax --stable

      - name: Test changed formulae
        if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae

  cask-install:
    name: Install ${{ matrix.cask }}
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cask: [imessage-relay, imessage-relay@rc]
    permissions:
      contents: read
    env:
      CASK: luxass/tap/${{ matrix.cask }}
    steps:
      - name: Set up Homebrew and check out the tap
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          token: ${{ github.token }}
          stable: true

      - name: Detect cask changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CASK_PATH: Casks/${{ matrix.cask }}.rb
        run: |
          changed="$(git diff --name-only --diff-filter=AMR "${BASE_SHA}" "${GITHUB_SHA}" -- "${CASK_PATH}")"
          if [[ -n "${changed}" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install cask
        id: install
        if: steps.changed.outputs.changed == 'true'
        run: brew install --cask "${CASK}"

      - name: Check app and CLI
        if: steps.changed.outputs.changed == 'true'
        run: |
          test -d "/Applications/iMessage Relay.app"
          expected_version="$(brew info --cask --json=v2 "${CASK}" | jq -r '.casks[0].version')"
          test "$(imessage-relay --version)" = "${expected_version}"
          imessage-relay --help

      - name: Uninstall cask
        if: always() && steps.install.outcome == 'success'
        run: brew uninstall --cask "${CASK}"
