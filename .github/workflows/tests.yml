# Adapted from https://github.com/dmmulroy/homebrew-tap/blob/main/.github/workflows/tests.yml.
name: Homebrew tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test-bot:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew and check out the tap
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          token: ${{ github.token }}
          stable: true

      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      # Stable syntax checks parse every formula and cask without applying
      # Homebrew development-only style rules to the updater checksum markers.
      - run: brew test-bot --only-tap-syntax --stable
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

  cask-install:
    name: Install ${{ matrix.cask }}
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cask: [imessage-relay, imessage-relay@rc]
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew and check out the tap
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          token: ${{ github.token }}
          stable: true

      - name: Check whether this cask changed
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CASK_PATH: Casks/${{ matrix.cask }}.rb
        run: |
          changed="$(git diff --name-only --diff-filter=AMR "${BASE_SHA}" "${GITHUB_SHA}" -- "${CASK_PATH}")"
          if [[ -n "${changed}" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install the changed cask
        id: install
        if: steps.changed.outputs.changed == 'true'
        env:
          CASK: luxass/tap/${{ matrix.cask }}
        run: brew install --cask "${CASK}"

      - name: Verify the app and CLI without launching the relay
        if: steps.changed.outputs.changed == 'true'
        env:
          CASK: luxass/tap/${{ matrix.cask }}
        run: |
          test -d "/Applications/iMessage Relay.app"
          expected_version="$(brew info --cask --json=v2 "${CASK}" | jq -r '.casks[0].version')"
          test "$(imessage-relay --version)" = "${expected_version}"
          imessage-relay --help

      - name: Uninstall the cask
        if: always() && steps.install.outcome == 'success'
        env:
          CASK: luxass/tap/${{ matrix.cask }}
        run: brew uninstall --cask "${CASK}"
